name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # Pinned: ubuntu-latest is now 26.04, which has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Audit the real PR commits, not GitHub's synthetic merge commit
          # (it carries the PR opener's personal identity).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - name: Install LibreOffice and Poppler (enables the PDF build and layout checks)
        if: matrix.python-version == '3.12'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - run: python -m pytest -q
      - name: Privacy audit (generic checks, full history)
        run: python scripts/privacy_audit.py

  secrets:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the CLI over the full history instead of gitleaks-action, whose push
      # range (<before>^..<head>) breaks when <before> is the root commit.
      - name: Scan full history with gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --redact -v --exit-code=2 --log-opts="--no-merges"

  tag:
    # A pushed v* tag must match plugin.json and have a CHANGELOG section.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/release.py --verify-tag "$GITHUB_REF_NAME"
